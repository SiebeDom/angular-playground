<p-table [value]="vetsValue()" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template #caption>
    <div class="flex justify-between">
      <h1>Vets</h1>
      <p-button label="Create" [routerLink]="'/vet/create'"/>
      <p-button label="Create with pets" [routerLink]="'/vet/createWithPets'"/>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-vet>
    <tr>
      <td>{{ vet.id }}</td>
      <td>{{ vet.name }}</td>
      <td>
        <p-button label="Edit" severity="secondary" [routerLink]="'/vet/update/' + vet.id"/>
      </td>
    </tr>
  </ng-template>
</p-table>
