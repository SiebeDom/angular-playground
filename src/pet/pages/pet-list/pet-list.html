<p-table [value]="petsValue()" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template #caption>
    <div class="flex justify-between">
      <h1>Pets</h1>
      <p-button label="Create" [routerLink]="'/pet/create'"/>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Type</th>
      <th>Mood</th>
      <th class="min-w-48"></th>
    </tr>
  </ng-template>
  <ng-template #body let-pet>
    <tr>
      <td>{{ pet.id }}</td>
      <td>{{ pet.name }}</td>
      <td>{{ pet.type }}</td>
      <td>{{ pet.mood }}</td>
      <td>
        <p-button icon="pi pi-pencil" [rounded]="true" [outlined]="true" [routerLink]="['/pet', 'update', pet.id]"/>
      </td>
    </tr>
  </ng-template>
</p-table>
