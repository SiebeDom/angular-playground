<p-table [value]="petsValue()" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template #caption>
    <div class="flex justify-between">
      <h1>Pets</h1>
      <a routerLink="/pet/create" pButton>
        <span pButtonLabel>Create</span>
      </a>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Type</th>
      <th>Mood</th>
      <th style="min-width: 12rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-pet>
    <tr>
      <td>{{ pet.id }}</td>
      <td>{{ pet.name }}</td>
      <td>{{ pet.type }}</td>
      <td>{{ pet.mood }}</td>
      <td>
        <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" [routerLink]="['/pet', 'update', pet.id]" />
<!--        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteProduct(product)" />-->
      </td>
    </tr>
  </ng-template>
</p-table>
